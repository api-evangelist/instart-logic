name: Instart Logic
description: >-
  Instart Logic was a web application performance and security company founded
  in 2010 (originally as Zettata) and headquartered in Palo Alto, California. It
  pioneered an endpoint-integrated cloud delivery architecture that paired a
  cloud service with a client-side JavaScript engine (the Nanovisor) running in
  the browser to accelerate web and mobile web applications, optimize and stream
  images (SmartVision), and defend applications with bot management and a web
  application firewall. Backed by Andreessen Horowitz, Kleiner Perkins, Tenaya
  Capital, Greylock, Sutter Hill Ventures and others across roughly $140M+ in
  venture funding, the company's technology assets were acquired by Akamai
  Technologies in early 2020, after which the business wound down. No live
  developer or API surface remains: the instartlogic.com domain resolves to no
  website host and is served by Akamai nameservers.
